[package]
name = "rust-skills-cli"
version = "2.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rust-skills"
path = "src/main.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true
